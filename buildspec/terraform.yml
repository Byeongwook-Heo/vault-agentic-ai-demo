version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - ./scripts/install-terraform.sh
  pre_build:
    commands:
      - set -euo pipefail
      - cd infra/terraform
      - umask 077
      - aws ssm get-parameter --name "/${PROJECT_NAME}/deployment/tfvars" --with-decryption --query Parameter.Value --output text > deployment.auto.tfvars.json
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="use_lockfile=true"
      - terraform validate
  build:
    commands:
      - |
        set -euo pipefail
        export TF_VAR_access_tier_enforcement="${ACCESS_TIER_ENFORCEMENT:-enforce}"
        export TF_VAR_verify_access_tier_claim="${VERIFY_ACCESS_TIER_CLAIM:-access_tier}"
        export TF_VAR_verify_access_tier_full_value="${VERIFY_ACCESS_TIER_FULL_VALUE:-orders-full}"
        export TF_VAR_verify_access_tier_limited_value="${VERIFY_ACCESS_TIER_LIMITED_VALUE:-orders-limited}"
        export TF_VAR_vault_version="${VAULT_VERSION:-2.1.0+ent}"
        vault_version="${TF_VAR_vault_version}"
        case "${TF_ACTION:-plan}" in
          validate)
            echo "Terraform initialization and validation succeeded."
            ;;
          plan)
            terraform plan -input=false -lock-timeout=5m -var="deploy_service=false" -var="vault_version=${vault_version}"
            ;;
          apply-base)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=false" -var="vault_version=${vault_version}"
            ;;
          deploy-bootstrap)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=bootstrap" -var="vault_version=${vault_version}"
            ;;
          deploy-app)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws" -var="vault_version=${vault_version}"
            ;;
          chatbot-plan)
            terraform plan -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws" -var="chatbot_enabled=true" -var="inference_enabled=true" -var="vault_version=${vault_version}"
            ;;
          deploy-chatbot)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws" -var="chatbot_enabled=true" -var="inference_enabled=true" -var="vault_version=${vault_version}"
            ;;
          source-cidr-add)
            source_cidr="${SOURCE_CIDR:?Set SOURCE_CIDR to an explicit IPv4 CIDR.}"
            if [[ ! "${source_cidr}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$ ]]; then
              echo "Invalid IPv4 CIDR: ${source_cidr}" >&2
              exit 2
            fi
            parameter_name="/${PROJECT_NAME}/allowed-source-cidrs"
            current_cidrs="$(aws ssm get-parameter --name "${parameter_name}" --query 'Parameter.Value' --output text)"
            merged_cidrs="${current_cidrs}"
            case ",${current_cidrs}," in
              *",${source_cidr},"*)
                echo "Source CIDR is already approved: ${source_cidr}"
                ;;
              *)
                merged_cidrs="${current_cidrs},${source_cidr}"
                aws ssm put-parameter \
                  --name "${parameter_name}" \
                  --description "Public source CIDRs allowed to reach the demo ALB and event SSH bastion" \
                  --type StringList \
                  --overwrite \
                  --value "${merged_cidrs}" >/dev/null
                echo "Added source CIDR: ${source_cidr}"
                ;;
            esac
            echo "Approved source CIDRs: ${merged_cidrs}"
            terraform plan -input=false -lock-timeout=2m \
              -target=aws_vpc_security_group_ingress_rule.alb_https \
              -target=aws_vpc_security_group_ingress_rule.bastion_ssh \
              -out=/tmp/source-cidr.tfplan
            terraform show -json /tmp/source-cidr.tfplan | jq -e --arg cidr "${source_cidr}" '
              [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])]
              | all(.[]; .change.actions == ["create"] and
                .type == "aws_vpc_security_group_ingress_rule" and .change.after.cidr_ipv4 == $cidr)
            ' >/dev/null
            terraform apply -input=false /tmp/source-cidr.tfplan
            ;;
          event-access-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_iam_role_policy.event_operator \
              -target=aws_iam_role_policy.vault_ssm_session_logging
            ;;
          event-access-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_iam_role_policy.event_operator \
              -target=aws_iam_role_policy.vault_ssm_session_logging
            ;;
          event-ssh-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_eip.bastion \
              -target=aws_vpc_security_group_ingress_rule.bastion_ssh \
              -target=aws_vpc_security_group_egress_rule.bastion_to_vault \
              -target=aws_vpc_security_group_egress_rule.bastion_https \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_udp \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_tcp \
              -target=aws_vpc_security_group_egress_rule.bastion_ntp \
              -target=aws_route53_record.bastion \
              -target=aws_ssm_association.bastion_event_ssh \
              -target=aws_ssm_association.vault_event_ssh \
              -target=aws_vpc_security_group_ingress_rule.vault_ssh_from_bastion
            ;;
          event-ssh-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_eip.bastion \
              -target=aws_vpc_security_group_ingress_rule.bastion_ssh \
              -target=aws_vpc_security_group_egress_rule.bastion_to_vault \
              -target=aws_vpc_security_group_egress_rule.bastion_https \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_udp \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_tcp \
              -target=aws_vpc_security_group_egress_rule.bastion_ntp \
              -target=aws_route53_record.bastion \
              -target=aws_ssm_association.bastion_event_ssh \
              -target=aws_ssm_association.vault_event_ssh \
              -target=aws_vpc_security_group_ingress_rule.vault_ssh_from_bastion
            ;;
          verify-jwks-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_vpc_security_group_ingress_rule.alb_verify_jwks_https \
              -target=aws_lb_listener_rule.verify_jwks \
              -target=aws_lb_listener_rule.deny_verify_other_paths
            ;;
          verify-jwks-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_vpc_security_group_ingress_rule.alb_verify_jwks_https \
              -target=aws_lb_listener_rule.verify_jwks \
              -target=aws_lb_listener_rule.deny_verify_other_paths
            ;;
          destroy)
            test "${CONFIRM_DESTROY:-}" = "${PROJECT_NAME}"
            terraform destroy -auto-approve -input=false -lock-timeout=5m -var="deploy_service=false"
            ;;
          *)
            echo "Unsupported TF_ACTION: ${TF_ACTION}" >&2
            exit 2
            ;;
        esac
