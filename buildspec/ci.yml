version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm --version
      - npm ci --ignore-scripts
  build:
    commands:
      - |
        set -euo pipefail
        case "${CI_TARGET:-ci}" in
          ci)
            npm run format:check
            npm run lint
            npm run typecheck
            npm test
            npm run build
            npm run security:deps
            ;;
          format)
            npm run format:check
            ;;
          lint)
            npm run lint
            ;;
          typecheck)
            npm run typecheck
            ;;
          test|test-unit|test-integration)
            npm run "${CI_TARGET}"
            ;;
          security-check)
            npm run security:deps
            ;;
          *)
            echo "Unsupported CI_TARGET: ${CI_TARGET}" >&2
            exit 2
            ;;
        esac

reports:
  unit-tests:
    files:
      - "apps/mcp-server/test-results/*.xml"
    file-format: JUNITXML
    discard-paths: true
