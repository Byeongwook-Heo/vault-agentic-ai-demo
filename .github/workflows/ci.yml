name: 소스 검증 / Source validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check:publication
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
